name: Install dependencies
description: Set up pnpm and Node.js and run pnpm install

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: true
  ignore-scripts:
    description: Skip the prepare scripts that build the workspace packages
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    # pnpm/action-setup installs a bootstrap pnpm and then switches to the
    # packageManager version, which takes about 10 seconds.
    - shell: bash
      run: npm install --global --no-audit --no-fund "$(node -p 'require("./package.json").packageManager.split("+")[0]')"

    - shell: bash
      run: pnpm i --no-frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
